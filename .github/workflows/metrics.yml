name: Generate metrics

# Requires a repository secret named METRICS_TOKEN (a GitHub personal access
# token). Without it the job is skipped instead of failing.

on:
  schedule:
    - cron: "53 4 * * *" # daily, 04:53 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}
    steps:
      - name: Missing token notice
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::METRICS_TOKEN secret is not set; skipping metrics generation."

      - uses: lowlighter/metrics@latest
        if: env.HAS_TOKEN == 'true'
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/metrics.svg
          user: yazicmert
          template: classic
          base: ""
          config_timezone: Europe/Berlin
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_ignored: html, css, jupyter notebook
          plugin_languages_limit: 6
